[alembic]
# Path to the migration scripts directory
script_location = alembic

# The sqlalchemy.url value is overridden at runtime by env.py (reads from settings.DATABASE_URL)
# This placeholder is never used when env.py is configured correctly.
sqlalchemy.url = sqlite:///./margveda.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
