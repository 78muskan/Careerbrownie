services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: careerbrownie_postgres
    environment:
      POSTGRES_DB: careerbrownie
      POSTGRES_USER: careerbrownie
      POSTGRES_PASSWORD: careerbrownie_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerbrownie -d careerbrownie"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: careerbrownie_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── AI Infrastructure ────────────────────────────────────────────────────────

  ollama:
    image: ollama/ollama:latest
    container_name: careerbrownie_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    dns:
      - 8.8.8.8
      - 8.8.4.4
    # Pull Qwen2.5:7b on first start, but use 0.5b for dev (fast startup)
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 8 && ollama pull qwen2.5:0.5b; wait"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/11434' 2>/dev/null && echo ok || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Application Services ────────────────────────────────────────────────────

  ai_service:
    build:
      context: ./ai_service
    container_name: careerbrownie_ai_service
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:0.5b
      # ChromaDB is file-based — no separate service needed, persist path is local to container
      CHROMA_PERSIST_DIR: /app/chroma_db
      REDIS_URL: redis://redis:6379/1
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EMBED_DEVICE: cpu
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000,http://127.0.0.1:8000
    ports:
      - "9000:9000"
    volumes:
      - chroma_data:/app/chroma_db
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: careerbrownie_backend
    environment:
      PROJECT_NAME: Career Brownie API
      VERSION: 1.0.0
      ENVIRONMENT: docker
      API_V1_PREFIX: /api/v1
      DATABASE_URL: postgresql+psycopg2://careerbrownie:careerbrownie_password@postgres:5432/careerbrownie
      AI_SERVICE_URL: http://ai_service:9000
      SECRET_KEY: replace-this-with-a-long-random-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      BACKEND_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ai_service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend-next
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_APP_URL: http://localhost:3000
    container_name: careerbrownie_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # ── Automation ──────────────────────────────────────────────────────────────

  n8n:
    image: n8nio/n8n:latest
    container_name: careerbrownie_n8n
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: careerbrownie
      DB_POSTGRESDB_USER: careerbrownie
      DB_POSTGRESDB_PASSWORD: careerbrownie_password
      DB_POSTGRESDB_SCHEMA: n8n
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me-in-production}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  ollama_data:
  n8n_data:
