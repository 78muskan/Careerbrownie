services:
  postgres:
    image: postgres:16-alpine
    container_name: careerbrownie_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-careerbrownie}
      POSTGRES_USER: ${POSTGRES_USER:-careerbrownie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careerbrownie} -d ${POSTGRES_DB:-careerbrownie}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: careerbrownie_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    container_name: careerbrownie_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    # Production: use the full 7B model
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 15 && ollama pull qwen2.5:7b && wait"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: careerbrownie_ai
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:7b
      # ChromaDB is file-based — persist to a Docker volume
      CHROMA_PERSIST_DIR: /app/chroma_db
      COLLECTION_NAME: careerbrownie_knowledge
      REDIS_URL: redis://redis:6379/1
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EMBED_DEVICE: cpu
      LOG_LEVEL: INFO
      RETRIEVAL_TOP_K: "6"
      RETRIEVAL_MIN_SCORE: "0.20"
      CORS_ORIGINS: https://${DOMAIN},https://www.${DOMAIN}
    expose:
      - "9000"
    volumes:
      - chroma_data:/app/chroma_db
    depends_on:
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  django:
    build:
      context: ./backend_django
      dockerfile: Dockerfile
    container_name: careerbrownie_django
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      ALLOWED_HOSTS: ${DOMAIN},www.${DOMAIN},localhost
      DB_ENGINE: django.db.backends.postgresql
      POSTGRES_DB: ${POSTGRES_DB:-careerbrownie}
      POSTGRES_USER: ${POSTGRES_USER:-careerbrownie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: https://${DOMAIN}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Career Brownie <hello@careerbrownie.com>}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AI_SERVICE_URL: http://ai_service:9000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    expose:
      - "8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn careerbrownie_backend.wsgi:application --bind 0.0.0.0:8001 --workers 3"

  celery:
    build:
      context: ./backend_django
      dockerfile: Dockerfile
    container_name: careerbrownie_celery
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
      REDIS_URL: redis://redis:6379/0
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-careerbrownie}
      POSTGRES_USER: ${POSTGRES_USER:-careerbrownie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: celery -A careerbrownie_backend worker -l info

  frontend:
    build:
      context: ./frontend-next
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN}/api/v1
        NEXT_PUBLIC_APP_URL: https://${DOMAIN}
    container_name: careerbrownie_frontend
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - django

  nginx:
    image: nginx:1.27-alpine
    container_name: careerbrownie_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
    depends_on:
      - django
      - frontend

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  ollama_data:
  static_files:
  media_files:
